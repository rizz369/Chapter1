<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chapter 1 Fitness - Onam Survey</title>

<style>

body{

  margin:0;

  background:#000;

  color:#fff;

  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;

}

.screen{display:none;min-height:100vh;padding:24px}

.screen.active{display:block}

.wrap{max-width:420px;margin:auto}

.logo{

  text-align:center;

  font-size:42px;

  font-weight:900;

  margin:30px 0 20px;

}

.logo span{color:#b6ff4d}

.card{

  background:#111;

  border:1px solid #222;

  border-radius:24px;

  padding:24px;

}

h1{text-align:center;margin:0 0 12px}

p{text-align:center;color:#bbb}

input[type=text]{

  width:100%;

  padding:16px;

  border-radius:16px;

  border:1px solid #333;

  background:#080808;

  color:#fff;

  font-size:16px;

  box-sizing:border-box;

}

button{

  width:100%;

  padding:16px;

  border:none;

  border-radius:16px;

  background:#b6ff4d;

  color:#000;

  font-weight:900;

  font-size:16px;

  margin-top:16px;

}

.secondary{

  background:#1a1a1a;

  color:#fff;

  border:1px solid #2a2a2a;

}

.option{

  background:#0b0b0b;

  border:1px solid #262626;

  border-radius:20px;

  padding:16px;

  margin-bottom:12px;

}

.option.selected{border-color:#b6ff4d}

.option label{

  display:flex;

  gap:12px;

  align-items:flex-start;

}

.small{font-size:14px;color:#bbb}

.center{text-align:center}

.check{

  width:96px;height:96px;border-radius:50%;

  background:rgba(182,255,77,.12);

  border:2px solid rgba(182,255,77,.35);

  display:flex;align-items:center;justify-content:center;

  margin:20px auto;

  font-size:48px;

  color:#b6ff4d;

}

.member{

  display:inline-block;

  background:#151515;

  border:1px solid #2a2a2a;

  padding:8px 14px;

  border-radius:999px;

  margin-top:10px;

}

.summary{

  background:#111;

  border:1px solid #222;

  border-radius:24px;

  padding:22px;

  margin-top:20px;

}

.bar{

  height:10px;

  background:#1c1c1c;

  border-radius:999px;

  overflow:hidden;

  margin-top:6px;

}

.fill{

  height:100%;

  background:#b6ff4d;

}

</style>

</head>

<body>

<div class="screen active" id="nameScreen">

  <div class="wrap">

    <div class="logo">
  <div class="chapter">Chapter<span>.</span>1</div>
  <div class="fitness">FITNESS</div>
</div>

    <div class="card">

      <h1>Onam Secret Survey</h1>

      <p>Your vote is private and confidential.</p>

      <input type="text" id="memberName" placeholder="Enter your name">

      <button id="continueBtn">CONTINUE</button>

    </div>

  </div>

</div>

<div class="screen" id="voteScreen">

  <div class="wrap">

    <div class="logo">Chapter<span>.1</span></div>

    <div class="center"><div class="member" id="displayName"></div></div>

    <div class="card" style="margin-top:14px">

      <h1>Select Your Holiday</h1>

      <div class="option">

        <label>

          <input type="radio" name="vote" value="2½ days holiday">

          <div><div><b>2½ days holiday</b></div><div class="small">Uthradam Afternoon, Thiruvonam, Avittam</div></div>

        </label>

      </div>

      <div class="option">

        <label>

          <input type="radio" name="vote" value="3 days holiday">

          <div><div><b>3 days holiday</b></div><div class="small">Uthradam, Thiruvonam, Avittam</div></div>

        </label>

      </div>

      <div class="option">

        <label>

          <input type="radio" name="vote" value="2 days holiday">

          <div><div><b>2 days holiday</b></div><div class="small">Thiruvonam, Avittam</div></div>

        </label>

      </div>

      <div class="option">

        <label>

          <input type="radio" name="vote" value="1 day holiday">

          <div><div><b>1 day holiday</b></div><div class="small">Thiruvonam only</div></div>

        </label>

      </div>

      <button id="submitBtn">SUBMIT VOTE</button>

      <button class="secondary" id="backBtn">BACK</button>

    </div>

  </div>

</div>

<div class="screen" id="thankScreen">

  <div class="wrap center">

    <div class="logo">Chapter<span>.1</span></div>

    <div class="check">✓</div>

    <h1>Thank You!</h1>

    <p>Your response has been recorded successfully.</p>

    <div class="member" id="thanksName"></div>

    <button id="nextBtn" style="margin-top:24px">READY FOR NEXT MEMBER</button>

    <button class="secondary" id="resultsBtn">TEAM Chapter.1 Fitness</button>

  </div>

</div>

<div class="screen" id="summaryScreen">

  <div class="wrap">

    <div class="logo">Chapter<span>.1</span></div>

    <div class="summary">

      <h1>Survey Summary</h1>

      <div id="summaryContent"></div>

      <button class="secondary" id="closeSummary">CLOSE</button>

    </div>

  </div>

</div>

<script>

let currentName = '';

function show(id){

  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));

  document.getElementById(id).classList.add('active');

}

function getVotes(){

  try{return JSON.parse(localStorage.getItem('chapter1_votes')||'[]')}catch(e){return[]}

}

function saveVotes(v){localStorage.setItem('chapter1_votes',JSON.stringify(v))}

document.getElementById('continueBtn').onclick=function(){

  const name=document.getElementById('memberName').value.trim();

  if(!name){alert('Please enter your name');return;}

  currentName=name;

  document.getElementById('displayName').textContent='👤 '+name;

  show('voteScreen');

};

document.querySelectorAll('.option input').forEach(input=>{

  input.addEventListener('change',()=>{

    document.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));

    input.closest('.option').classList.add('selected');

  });

});

document.getElementById('backBtn').onclick=function(){show('nameScreen')};

document.getElementById('submitBtn').onclick=function(){

  const selected=document.querySelector('input[name="vote"]:checked');

  if(!selected){alert('Please select an option');return;}

  const votes=getVotes();

  votes.push({name:currentName,vote:selected.value,time:new Date().toLocaleString()});

  saveVotes(votes);

  document.getElementById('thanksName').textContent='👤 '+currentName;

  show('thankScreen');

};

document.getElementById('nextBtn').onclick=function(){

  currentName='';

  document.getElementById('memberName').value='';

  document.querySelectorAll('input[name="vote"]').forEach(i=>i.checked=false);

  document.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));

  show('nameScreen');

};

document.getElementById('resultsBtn').onclick=function(){

  const pin=prompt('Enter PIN');

  if(pin!=='2026')return;

  const votes=getVotes();

  const options=['2½ days holiday','3 days holiday','2 days holiday','1 day holiday'];

  const counts={};

  options.forEach(o=>counts[o]=0);

  votes.forEach(v=>counts[v.vote]=(counts[v.vote]||0)+1);

  const total=votes.length;

  const winner=options.sort((a,b)=>counts[b]-counts[a])[0];

  let html='<p><b>Total votes:</b> '+total+'</p>';

  if(total>0)html+='<p><b>Leading option:</b> '+winner+'</p>';

  ['2½ days holiday','3 days holiday','2 days holiday','1 day holiday'].forEach(opt=>{

    const c=counts[opt];

    const pct=total?Math.round(c/total*100):0;

    html+='<div style="margin:16px 0"><div><b>'+opt+'</b> — '+c+' votes ('+pct+'%)</div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div></div>';

  });

  html+='<hr style="border-color:#222"><h3>Individual Votes</h3>';

  votes.slice().reverse().forEach(v=>{

    html+='<div style="padding:10px 0;border-bottom:1px solid #222"><b>'+v.name+'</b><br><span class="small">'+v.vote+'</span></div>';

  });

  document.getElementById('summaryContent').innerHTML=html;

  show('summaryScreen');

};

document.getElementById('closeSummary').onclick=function(){show('thankScreen')};

</script>

</body>

</html>
